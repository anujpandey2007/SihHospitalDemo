spring.application.name=SihHospital
# =====================================================================
# 1. JDBC DataSource Configuration (Low-level Connection)
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sihhospital
spring.datasource.username=root
spring.datasource.password=asdfghjkl
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# 2. Hibernate / JPA Configuration (High-level ORM Engine)
# =====================================================================
# Specifies the database dialect so Hibernate knows how to translate Java to MySQL-specific SQL syntax
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Automatically manages database tables based on your Java Entity classes
# Options:
#   update: Updates the schema if your entity classes change (Good for development)
#   create: Drops existing tables and creates new ones on startup
#   none: Does not modify tables (Crucial for production environments)
spring.jpa.hibernate.ddl-auto=create

# =====================================================================
# 3. Logging & Debugging (Optional but highly recommended for learning)
# =====================================================================
# Shows the exact SQL statements generated by Hibernate in your console terminal
spring.jpa.show-sql=true

# Pretty-prints the console SQL output so it is clean and readable
spring.jpa.properties.hibernate.format_sql=true

# Displays the literal values bound to the SQL parameters (?)
logging.level.org.hibernate.orm.jdbc.bind=trace